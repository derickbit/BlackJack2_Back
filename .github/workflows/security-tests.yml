name: CardNest security regression tests

on:
  push:
    branches: [maintenance/security-local-setup]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-scripts --no-plugins
      - name: Check PHP syntax
        run: find app tests database/seeders routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run isolated security regression tests
        run: vendor/bin/phpunit -c phpunit.security.xml --fail-on-warning --fail-on-risky
